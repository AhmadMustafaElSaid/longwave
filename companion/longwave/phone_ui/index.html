<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173632" />
    <title>Longwave</title>
    <link rel="stylesheet" href="/phone.css" />
    <script type="module" src="/phone.js"></script>
  </head>
  <body>
    <header><strong>Longwave</strong><button id="language" type="button">العربية</button></header>
    <main>
      <h1 data-copy="title">Your audio library</h1>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="pairing" hidden>
        <h2 data-copy="pair">Pair this device</h2>
        <p data-copy="instructions">Enter the one-time code shown on your computer.</p>
        <form id="pair-form">
          <label for="code" data-copy="code">Pairing code</label>
          <input
            id="code"
            required
            maxlength="30"
            autocomplete="one-time-code"
            autocapitalize="none"
            spellcheck="false"
            dir="ltr"
          />
          <button class="primary" data-copy="connect">Connect</button>
        </form>
      </section>
      <div id="library" hidden>
        <section>
          <h2 data-copy="add">Add a track</h2>
          <form id="track-form">
            <label for="link" data-copy="link">SoundCloud link or share message</label>
            <input
              id="link"
              required
              maxlength="4096"
              autocapitalize="none"
              spellcheck="false"
              dir="auto"
            />
            <label for="format" data-copy="format">Audio format</label>
            <select id="format">
              <option value="original" data-copy="source">Source audio</option>
              <option value="mp3">MP3</option>
            </select>
            <button class="primary" data-copy="download">Download on computer</button>
          </form>
          <p class="fine" data-copy="rights">
            Save audio you own or have permission to keep. Follow the license and SoundCloud terms.
          </p>
        </section>
        <section id="player" hidden>
          <h2 id="playing" dir="auto"></h2>
          <audio id="audio" controls preload="none"></audio>
          <label for="rate" data-copy="speed">Playback speed</label>
          <select id="rate">
            <option value="1">1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </section>
        <section>
          <h2 data-copy="queue">Downloads</h2>
          <p id="empty" data-copy="empty">Your downloads will appear here.</p>
          <ul id="jobs"></ul>
        </section>
      </div>
    </main>
  </body>
</html>
