name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run setup:media
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install --require-hashes -r companion\requirements.txt
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
