name: Build release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run setup:media
      - run: python -m venv .venv
      - run: .\.venv\Scripts\python.exe -m pip install --require-hashes -r companion\requirements.txt
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run release:windows
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        with:
          name: longwave-windows-release-candidate
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 30
